<style>
  .face{ --glow:#44d9ff; --dim:#7fc9ff99; --bg:#07090b; --bezel:#1e2227;
    --fs-label: 12px; --fs-source: clamp(20px, 6vw, 40px); --fs-mode: 20px; --fs-vol: clamp(10px, 14vw, 35px);
    height: clamp(160px, 32vw, 243px); padding: 10px; background: var(--bg); border-radius: 10px;
    box-shadow: inset 0 0 0 1px var(--bezel), inset 0 0 18px rgba(0,0,0,.6), 0 0 0 1px #000, 0 10px 30px rgba(0,0,0,.45); }
  .offwrap{ display:flex; align-items:center; justify-content:center; height:100%; }
  .offtext{ font-family:'ledFont', ui-monospace, monospace; color: var(--dim); text-transform: uppercase;
    letter-spacing:.28em; font-size: clamp(18px, 4.6vw, 44px); white-space: nowrap; }
  .grid{ display:grid; grid-template-columns: 1fr 1fr auto; grid-template-rows: auto 1fr auto;
    grid-template-areas: "kvline kvline vol" "source source vol" "mode2 mode2 vol"; height: 100%; align-items: center; }
  .label{ font-family:'displayFont', ui-monospace, monospace; font-size: var(--fs-label); letter-spacing:.25em;
    text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .value{ font-family:'ledFont', ui-monospace, monospace; font-size: calc(var(--fs-label) * 1.4); letter-spacing:.18em;
    text-transform: uppercase; white-space: nowrap; }
  .value-glow{ color: var(--glow); text-shadow: 0 0 1px var(--glow), 0 0 3px var(--glow), 0 0 8px var(--glow), 0 0 16px rgba(68,217,255,.55); }
  .kvline{ grid-area: kvline; display:flex; justify-content: space-between; gap: clamp(8px, 2vw, 32px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-items: baseline; min-width: 0; }
  .kv{ display:flex; gap:.6em; align-items:baseline; min-width:0; }
  .kv .value{ overflow:hidden; text-overflow: ellipsis; }
  .center-source{ grid-area: source; font-family:'ledFont', ui-monospace, monospace; font-size: var(--fs-source);
    letter-spacing:.22em; text-align:center; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  .bottom-mode{ grid-area: mode2; font-family:'ledFont', ui-monospace, monospace; font-size: var(--fs-mode);
    letter-spacing:.28em; place-self:center; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  .vol{ grid-area: vol; justify-self:end; align-self:center; font-family:'displayFont', ui-monospace, monospace;
    font-size: var(--fs-vol); line-height:.9; letter-spacing:.06em; white-space: nowrap; }
  @media (max-width: 520px){
    .grid{ grid-template-columns: 1fr auto; grid-template-areas: "kvline vol" "source source" "mode2 mode2"; }
    .kvline{ flex-direction: column; align-items: flex-start; gap: .25em; }
    .kvline .kv{ width: 100%; justify-content: flex-start; }
    .kvline .value{ max-width: 100%; }
  }
</style>
<div class="face">
    <div class="grid">
      <div class="kvline">
        <div class="kv"><div class="label">MODE:</div><div class="value value-glow">STEREO</div></div>
        <div class="kv"><div class="label">TYPE:</div><div class="value value-glow">CHANNEL</div></div>
        <div class="kv"><div class="label">TV:</div><div class="value value-glow">HDMI1</div></div>
      </div>
      <div class="vol value-glow">42.5</div>
      <div class="center-source value-glow">TV Audio</div>
      <div class="bottom-mode value-glow">2CH STEREO</div>
    </div>
</div>
